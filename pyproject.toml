[project]
name = "meddatatrace"
version = "0.1.0"
description = "Evidence-qualified review of dataset issues in medical-imaging evaluations"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E721"]

[dependency-groups]
dev = [
    "ruff==0.16.7",
]
