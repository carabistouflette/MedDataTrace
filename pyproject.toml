[project]
name = "meddatatrace"
version = "0.1.0"
description = "Evidence-qualified review of dataset issues in medical-imaging evaluations"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PIE", "RET", "RUF", "SIM", "UP"]
ignore = ["E721"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.7",
]
